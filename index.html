<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iOS Live Aesthetic Clock</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* 全螢幕背景容器 */
        .fullscreen-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* 沿著畫面邊緣排列的動態跑秒刻度 */
        .edge-tick {
            position: absolute;
            background-color: rgba(255, 255, 255, 0.18);
            border-radius: 2px;
            transition: background-color 0.3s ease, transform 0.3s ease;
            pointer-events: none;
        }
        /* 當秒數走到該刻度時亮起（模擬 iOS 錶盤跑秒進度） */
        .edge-tick.active {
            background-color: rgba(255, 255, 255, 0.95);
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.6);
        }

        /* 核心時鐘群組 */
        .clock-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 2;
            transition: transform 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.25s ease;
        }

        /* 雙擊觸發的城市標題 */
        .city-header {
            font-size: 2.8rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 8px;
            cursor: pointer;
            user-select: none;
            letter-spacing: 1.5px;
            transition: color 0.2s, transform 0.2s;
        }
        .city-header:hover {
            color: #ffffff;
            transform: scale(1.02);
        }
        .city-header:active {
            transform: scale(0.97);
        }

        /* 超大粗體時間數字 */
        .time-display {
            font-size: 30vw;
            font-weight: 800;
            letter-spacing: -8px;
            color: #ffffff;
            font-variant-numeric: tabular-nums;
            line-height: 0.95;
            user-select: none;
        }

        @media (min-width: 1200px) {
            .time-display {
                font-size: 340px;
            }
        }

        /* 隱藏式 24 時區選單（蘋果風格模糊玻璃擬態） */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-card {
            background: rgba(30, 30, 35, 0.82);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 36px;
            width: 88%;
            max-width: 580px;
            max-height: 78vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.85);
            transform: scale(0.9) translateY(20px);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .modal-overlay.active .modal-card {
            transform: scale(1) translateY(0);
        }

        .modal-header {
            padding: 24px 28px 18px;
            font-size: 1.3rem;
            font-weight: 700;
            color: #fff;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-close {
            background: rgba(255, 255, 255, 0.08);
            border: none;
            color: #fff;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-size: 1.1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }
        .modal-close:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .timezone-list {
            overflow-y: auto;
            padding: 20px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .timezone-item {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 14px 16px;
            border-radius: 18px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .timezone-item:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.25);
            transform: translateY(-2px);
        }

        .timezone-item.selected {
            background: rgba(0, 113, 227, 0.35);
            border-color: rgba(0, 125, 250, 0.7);
        }

        .tz-city {
            font-weight: 700;
            font-size: 1.05rem;
            color: #fff;
        }

        .tz-sub {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.45);
        }

        .timezone-list::-webkit-scrollbar {
            width: 6px;
        }
        .timezone-list::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 3px;
        }
    </style>
</head>
<body>

    <div class="fullscreen-container" id="container">
        <!-- 核心時鐘區 -->
        <div class="clock-content" id="clockContent">
            <!-- 雙擊地名呼叫隱藏選單 -->
            <div class="city-header" id="cityHeader" title="請對著地名「雙擊兩下」開啟時區選單">載入中...</div>
            <div class="time-display" id="timeDisplay">00:00</div>
        </div>
    </div>

    <!-- 24 時區選單彈窗 -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-card">
            <div class="modal-header">
                <span>選擇時區 (共 24 個全球城市)</span>
                <button class="modal-close" id="modalClose">&times;</button>
            </div>
            <div class="timezone-list" id="timezoneList"></div>
        </div>
    </div>

    <script>
        // 24 個全球經典時區清單
        const timezones = [
            { name: "台北", zone: "Asia/Taipei", label: "UTC+8" },
            { name: "東京", zone: "Asia/Tokyo", label: "UTC+9" },
            { name: "首爾", zone: "Asia/Seoul", label: "UTC+9" },
            { name: "香港 / 新加坡", zone: "Asia/Hong_Kong", label: "UTC+8" },
            { name: "曼谷", zone: "Asia/Bangkok", label: "UTC+7" },
            { name: "孟買", zone: "Asia/Kolkata", label: "UTC+5:30" },
            { name: "杜拜", zone: "Asia/Dubai", label: "UTC+4" },
            { name: "莫斯科", zone: "Europe/Moscow", label: "UTC+3" },
            { name: "巴黎 / 羅馬", zone: "Europe/Paris", label: "UTC+1" },
            { name: "倫敦", zone: "Europe/London", label: "UTC+0" },
            { name: "雷克雅維克", zone: "Atlantic/Reykjavik", label: "UTC+0" },
            { name: "紐約", zone: "America/New_York", label: "UTC-5" },
            { name: "芝加哥", zone: "America/Chicago", label: "UTC-6" },
            { name: "丹佛", zone: "America/Denver", label: "UTC-7" },
            { name: "洛杉磯", zone: "America/Los_Angeles", label: "UTC-8" },
            { name: "溫哥華", zone: "America/Vancouver", label: "UTC-8" },
            { name: "聖保羅", zone: "America/Sao_Paulo", label: "UTC-3" },
            { name: "布宜諾斯艾利斯", zone: "America/Argentina/Buenos_Aires", label: "UTC-3" },
            { name: "雪梨", zone: "Australia/Sydney", label: "UTC+10" },
            { name: "奧克蘭", zone: "Pacific/Auckland", label: "UTC+12" },
            { name: "檀香山", zone: "Pacific/Honolulu", label: "UTC-10" },
            { name: "開羅", zone: "Africa/Cairo", label: "UTC+2" },
            { name: "墨西哥城", zone: "America/Mexico_City", label: "UTC-6" },
            { name: "多倫多", zone: "America/Toronto", label: "UTC-5" }
        ];

        let selectedTimezone = null;
        let selectedCityName = "";
        const totalTicks = 60; // 60 個刻度對應 60 秒
        const tickElements = [];

        // 初始化：預設抓取目前位置
        function initLocation() {
            try {
                const systemTz = Intl.DateTimeFormat().resolvedOptions().timeZone;
                const found = timezones.find(t => t.zone === systemTz);
                if (found) {
                    selectedTimezone = found.zone;
                    selectedCityName = found.name;
                } else {
                    selectedTimezone = "Asia/Taipei";
                    selectedCityName = "台北";
                }
            } catch (e) {
                selectedTimezone = "Asia/Taipei";
                selectedCityName = "台北";
            }
            document.getElementById('cityHeader').textContent = selectedCityName;
        }

        // 動態生成環繞螢幕邊緣的 60 秒跑秒刻度
        function generateTicks() {
            const container = document.getElementById('container');
            
            for (let i = 0; i < totalTicks; i++) {
                const tick = document.createElement('div');
                tick.className = 'edge-tick';
                
                // 依據秒數分配在四個邊上 (上、右、下、左)
                let leftPct, topPct, width = '10px', height = '3px';
                
                if (i < 15) { // 上邊 (0~14秒)
                    leftPct = (i / 15) * 96 + 2;
                    topPct = 2;
                    width = '8px'; height = '3px';
                } else if (i < 30) { // 右邊 (15~29秒)
                    leftPct = 98;
                    topPct = ((i - 15) / 15) * 96 + 2;
                    width = '3px'; height = '8px';
                } else if (i < 45) { // 下邊 (30~44秒)
                    leftPct = 100 - ((i - 30) / 15) * 96 - 2;
                    topPct = 98;
                    width = '8px'; height = '3px';
                } else { // 左邊 (45~59秒)
                    leftPct = 2;
                    topPct = 100 - ((i - 45) / 15) * 96 - 2;
                    width = '3px'; height = '8px';
                }

                tick.style.left = `${leftPct}%`;
                tick.style.top = `${topPct}%`;
                tick.style.width = width;
                tick.style.height = height;

                container.appendChild(tick);
                tickElements.push(tick);
            }
        }

        // 渲染時區選單
        function renderList() {
            const list = document.getElementById('timezoneList');
            list.innerHTML = '';
            timezones.forEach(t => {
                const item = document.createElement('div');
                item.className = `timezone-item ${selectedTimezone === t.zone ? 'selected' : ''}`;
                item.innerHTML = `
                    <div class="tz-city">${t.name}</div>
                    <div class="tz-sub">${t.zone} (${t.label})</div>
                `;
                item.addEventListener('click', () => {
                    selectedTimezone = t.zone;
                    selectedCityName = t.name;
                    document.getElementById('cityHeader').textContent = selectedCityName;
                    
                    // 切換時區時的流暢縮放動效
                    triggerTransitionAnim();
                    toggleModal(false);
                    renderList();
                });
                list.appendChild(item);
            });
        }

        function triggerTransitionAnim() {
            const content = document.getElementById('clockContent');
            content.style.transform = 'scale(0.92)';
            content.style.opacity = '0.2';
            setTimeout(() => {
                content.style.transform = 'scale(1)';
                content.style.opacity = '1';
            }, 300);
        }

        // 更新時間與秒數跑格刻度
        function updateClock() {
            const now = new Date();
            let timeStr = "";
            let currentSecond = 0;

            try {
                // 取得對應時區的時間與秒數
                const formatter = new Intl.DateTimeFormat('en-GB', {
                    timeZone: selectedTimezone,
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit',
                    hour12: false
                });
                const parts = formatter.formatToParts(now);
                const h = parts.find(p => p.type === 'hour').value;
                const m = parts.find(p => p.type === 'minute').value;
                const s = parts.find(p => p.type === 'second').value;
                
                timeStr = `${h}:${m}`;
                currentSecond = parseInt(s, 10);
            } catch (e) {
                const h = String(now.getHours()).padStart(2, '0');
                const m = String(now.getMinutes()).padStart(2, '0');
                const s = now.getSeconds();
                timeStr = `${h}:${m}`;
                currentSecond = s;
            }

            // 更新大數字
            const timeEl = document.getElementById('timeDisplay');
            if (timeEl.textContent !== timeStr) {
                timeEl.textContent = timeStr;
            }

            // 更新邊框跑秒刻度（當前秒數之前的刻度亮起，呈現類似 iOS 錶盤流動感）
            tickElements.forEach((tick, index) => {
                if (index <= currentSecond) {
                    tick.classList.add('active');
                } else {
                    tick.classList.remove('active');
                }
            });
        }

        // 彈窗雙擊互動控制
        const overlay = document.getElementById('modalOverlay');
        const cityHeader = document.getElementById('cityHeader');
        const closeBtn = document.getElementById('modalClose');

        function toggleModal(show) {
            if (show) {
                overlay.classList.add('active');
            } else {
                overlay.classList.remove('active');
            }
        }

        // 嚴格實作「雙擊 (dblclick)」觸發隱藏選單
        cityHeader.addEventListener('dblclick', () => {
            toggleModal(true);
        });

        // 為了手機觸控或避免誤觸，提供備用：點擊一下也可以或維持雙擊（你要求雙擊，此處以 dblclick 為主）
        closeBtn.addEventListener('click', () => toggleModal(false));
        overlay.addEventListener('click', (e) => {
            if (e.target === overlay) toggleModal(false);
        });

        // 啟動執行
        generateTicks();
        initLocation();
        renderList();
        setInterval(updateClock, 200);
        updateClock();
    </script>
</body>
</html>
