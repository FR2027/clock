<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FR Clock</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
            /* iOS 鎖定畫面高級流動漸層背景：深邃藍紫與星空感交織 */
            background: linear-gradient(125deg, #090612, #18112c, #0a1122, #020204);
            background-size: 350% 350%;
            animation: lockscreenGlow 25s ease infinite;
        }

        @keyframes lockscreenGlow {
            0% { background-position: 0% 40%; }
            50% { background-position: 100% 60%; }
            100% { background-position: 0% 40%; }
        }

        /* 擬真光學微光網格，提升背景光影層次 */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at 50% 30%, rgba(120, 110, 255, 0.1) 0%, transparent 65%);
            pointer-events: none;
            z-index: 1;
        }

        /* 全螢幕背景容器 */
        .fullscreen-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            z-index: 2;
        }

        /* 核心時鐘群組 */
        .clock-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* 雙擊觸發的城市標題 */
        .city-header {
            font-size: 2.4rem;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 14px;
            cursor: pointer;
            user-select: none;
            letter-spacing: 2.5px;
            transition: color 0.25s ease, transform 0.25s ease;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
        }
        .city-header:hover {
            color: rgba(255, 255, 255, 0.95);
            transform: scale(1.02);
        }
        .city-header:active {
            transform: scale(0.97);
        }

        /* iOS 鎖定畫面 Liquid Glass 質感時間容器 */
        .time-display {
            font-size: 30vw;
            font-weight: 700;
            letter-spacing: -6px;
            color: rgba(255, 255, 255, 0.38);
            font-variant-numeric: tabular-nums;
            line-height: 0.9;
            user-select: none;
            display: flex;
            align-items: center;
            justify-content: center;
            /* 蘋果鎖定畫面經典高光與深度陰影 */
            text-shadow: 
                0 1px 2px rgba(255, 255, 255, 0.6),
                0 4px 20px rgba(0, 0, 0, 0.85),
                0 0 50px rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(0.5px);
            -webkit-backdrop-filter: blur(0.5px);
        }

        @media (min-width: 1200px) {
            .time-display {
                font-size: 340px;
            }
        }

        /* 每一位數字的 3D 翻轉動畫元件 (iOS 轉場質感) */
        .digit-box {
            position: relative;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            perspective: 800px;
        }

        .digit-inner {
            display: inline-block;
            transition: transform 0.55s cubic-bezier(0.2, 1.2, 0.4, 1), opacity 0.4s ease;
            transform-origin: center center;
        }

        /* 數字切換時的 iOS 彈性滑動與 3D 旋轉質感 */
        .digit-inner.flip-out {
            transform: translateY(-40px) rotateX(70deg) scale(0.9);
            opacity: 0;
        }

        .digit-inner.flip-in {
            transform: translateY(40px) rotateX(-70deg) scale(0.9);
            opacity: 0;
            animation: none;
        }

        .separator {
            display: inline-block;
            margin: 0 -0.05em;
            animation: colonPulse 2s ease-in-out infinite;
        }

        @keyframes colonPulse {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 0.7; }
        }

        /* 蘋果高級毛玻璃擬態時區選單 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(50px);
            -webkit-backdrop-filter: blur(50px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-card {
            background: rgba(20, 20, 25, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 36px;
            width: 85%;
            max-width: 580px;
            max-height: 78vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 50px 100px rgba(0, 0, 0, 0.9);
            transform: scale(0.92) translateY(15px);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .modal-overlay.active .modal-card {
            transform: scale(1) translateY(0);
        }

        .modal-header {
            padding: 24px 28px 18px;
            font-size: 1.25rem;
            font-weight: 600;
            color: #fff;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            justify-content: space-between;
            align-items: center;
            letter-spacing: 0.5px;
        }

        .modal-close {
            background: rgba(255, 255, 255, 0.08);
            border: none;
            color: #fff;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            font-size: 1.1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s, transform 0.2s;
        }
        .modal-close:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.05);
        }

        .timezone-list {
            overflow-y: auto;
            padding: 20px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .timezone-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 15px 18px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .timezone-item:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.25);
            transform: translateY(-2px);
        }

        .timezone-item.selected {
            background: rgba(10, 132, 255, 0.25);
            border-color: rgba(10, 132, 255, 0.6);
        }

        .tz-city {
            font-weight: 600;
            font-size: 1.05rem;
            color: #fff;
        }

        .tz-sub {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.45);
        }

        .timezone-list::-webkit-scrollbar {
            width: 6px;
        }
        .timezone-list::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 3px;
        }

        /* 測試控制面板 (方便您直接檢視 09:24 換到 09:25 的動態效果) */
        .test-controls {
            position: fixed;
            bottom: 25px;
            display: flex;
            gap: 12px;
            z-index: 100;
            background: rgba(20, 20, 25, 0.6);
            padding: 10px 18px;
            border-radius: 30px;
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .test-btn {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: #fff;
            padding: 6px 14px;
            border-radius: 15px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: background 0.2s, transform 0.1s;
        }
        .test-btn:hover {
            background: rgba(255, 255, 255, 0.25);
        }
        .test-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <div class="fullscreen-container" id="container">
        <!-- 核心時鐘區 -->
        <div class="clock-content" id="clockContent">
            <!-- 雙擊地名呼叫隱藏選單 -->
            <div class="city-header" id="cityHeader" title="對著地名「雙擊兩下」選擇時區">載入中...</div>
            
            <!-- 時間顯示容器：每一位數字獨立封裝以支援 iOS 3D 彈性翻轉動畫 -->
            <div class="time-display" id="timeDisplay">
                <div class="digit-box"><span class="digit-inner" id="d0">0</span></div>
                <div class="digit-box"><span class="digit-inner" id="d1">9</span></div>
                <div class="separator">:</div>
                <div class="digit-box"><span class="digit-inner" id="d2">2</span></div>
                <div class="digit-box"><span class="digit-inner" id="d3">4</span></div>
            </div>
        </div>
    </div>

    <!-- 快速測試按鈕 (點擊可立即預覽 9:24 換到 9:25 的 iOS 高質感滑動動畫) -->
    <div class="test-controls">
        <button class="test-btn" id="btnTest">測試 09:24 → 09:25 動畫</button>
        <button class="test-btn" id="btnNormal">恢復即時時鐘</button>
    </div>

    <!-- 24 時區選單彈窗 -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-card">
            <div class="modal-header">
                <span>選擇時區 (共 24 個全球城市)</span>
                <button class="modal-close" id="modalClose">&times;</button>
            </div>
            <div class="timezone-list" id="timezoneList"></div>
        </div>
    </div>

    <script>
        const timezones = [
            { name: "台北", zone: "Asia/Taipei", label: "UTC+8" },
            { name: "東京", zone: "Asia/Tokyo", label: "UTC+9" },
            { name: "首爾", zone: "Asia/Seoul", label: "UTC+9" },
            { name: "香港 / 新加坡", zone: "Asia/Hong_Kong", label: "UTC+8" },
            { name: "曼谷", zone: "Asia/Bangkok", label: "UTC+7" },
            { name: "孟買", zone: "Asia/Kolkata", label: "UTC+5:30" },
            { name: "杜拜", zone: "Asia/Dubai", label: "UTC+4" },
            { name: "莫斯科", zone: "Europe/Moscow", label: "UTC+3" },
            { name: "巴黎 / 羅馬", zone: "Europe/Paris", label: "UTC+1" },
            { name: "倫敦", zone: "Europe/London", label: "UTC+0" },
            { name: "雷克雅維克", zone: "Atlantic/Reykjavik", label: "UTC+0" },
            { name: "紐約", zone: "America/New_York", label: "UTC-5" },
            { name: "芝加哥", zone: "America/Chicago", label: "UTC-6" },
            { name: "丹佛", zone: "America/Denver", label: "UTC-7" },
            { name: "洛杉磯", zone: "America/Los_Angeles", label: "UTC-8" },
            { name: "溫哥華", zone: "America/Vancouver", label: "UTC-8" },
            { name: "聖保羅", zone: "America/Sao_Paulo", label: "UTC-3" },
            { name: "布宜諾斯艾利斯", zone: "America/Argentina/Buenos_Aires", label: "UTC-3" },
            { name: "雪梨", zone: "Australia/Sydney", label: "UTC+10" },
            { name: "奧克蘭", zone: "Pacific/Auckland", label: "UTC+12" },
            { name: "檀香山", zone: "Pacific/Honolulu", label: "UTC-10" },
            { name: "開羅", zone: "Africa/Cairo", label: "UTC+2" },
            { name: "墨西哥城", zone: "America/Mexico_City", label: "UTC-6" },
            { name: "多倫多", zone: "America/Toronto", label: "UTC-5" }
        ];

        let selectedTimezone = null;
        let selectedCityName = "";
        let lastTimeString = "";
        let isTestMode = false;

        function initLocation() {
            try {
                const systemTz = Intl.DateTimeFormat().resolvedOptions().timeZone;
                const found = timezones.find(t => t.zone === systemTz);
                if (found) {
                    selectedTimezone = found.zone;
                    selectedCityName = found.name;
                } else {
                    selectedTimezone = "Asia/Taipei";
                    selectedCityName = "台北";
                }
            } catch (e) {
                selectedTimezone = "Asia/Taipei";
                selectedCityName = "台北";
            }
            document.getElementById('cityHeader').textContent = selectedCityName;
        }

        function renderList() {
            const list = document.getElementById('timezoneList');
            list.innerHTML = '';
            timezones.forEach(t => {
                const item = document.createElement('div');
                item.className = `timezone-item ${selectedTimezone === t.zone ? 'selected' : ''}`;
                item.innerHTML = `
                    <div class="tz-city">${t.name}</div>
                    <div class="tz-sub">${t.zone} (${t.label})</div>
                `;
                item.addEventListener('click', () => {
                    selectedTimezone = t.zone;
                    selectedCityName = t.name;
                    document.getElementById('cityHeader').textContent = selectedCityName;
                    isTestMode = false;
                    toggleModal(false);
                    renderList();
                });
                list.appendChild(item);
            });
        }

        // 核心動畫更新函數：精準比對每一位數字，若有變動則套用 iOS 3D 彈性翻轉動畫
        function updateDigit(elementId, newChar) {
            const el = document.getElementById(elementId);
            if (!el) return;
            if (el.textContent !== newChar) {
                // 觸發向上的離場動畫
                el.classList.add('flip-out');
                setTimeout(() => {
                    el.textContent = newChar;
                    el.classList.remove('flip-out');
                    el.classList.add('flip-in');
                    // 瞬間重置進場狀態並滑回原位
                    setTimeout(() => {
                        el.classList.remove('flip-in');
                    }, 30);
                }, 270);
            }
        }

        function setTimeString(timeStr) {
            if (timeStr.length === 5) {
                updateDigit('d0', timeStr[0]);
                updateDigit('d1', timeStr[1]);
                updateDigit('d2', timeStr[3]);
                updateDigit('d3', timeStr[4]);
            }
        }

        function updateClock() {
            if (isTestMode) return;
            const now = new Date();
            let timeStr = "";

            try {
                const formatter = new Intl.DateTimeFormat('en-GB', {
                    timeZone: selectedTimezone,
                    hour: '2-digit',
                    minute: '2-digit',
                    hour12: false
                });
                timeStr = formatter.format(now);
            } catch (e) {
                const h = String(now.getHours()).padStart(2, '0');
                const m = String(now.getMinutes()).padStart(2, '0');
                timeStr = `${h}:${m}`;
            }

            if (timeStr !== lastTimeString) {
                setTimeString(timeStr);
                lastTimeString = timeStr;
            }
        }

        // 彈窗互動控制
        const overlay = document.getElementById('modalOverlay');
        const cityHeader = document.getElementById('cityHeader');
        const closeBtn = document.getElementById('modalClose');

        function toggleModal(show) {
            if (show) {
                overlay.classList.add('active');
            } else {
                overlay.classList.remove('active');
            }
        }

        cityHeader.addEventListener('dblclick', () => {
            toggleModal(true);
        });

        closeBtn.addEventListener('click', () => toggleModal(false));
        overlay.addEventListener('click', (e) => {
            if (e.target === overlay) toggleModal(false);
        });

        // 模擬測試：重現從 09:24 換到 09:25 的高質感動畫
        document.getElementById('btnTest').addEventListener('click', () => {
            isTestMode = true;
            // 先強制設為 09:24
            document.getElementById('d0').textContent = '0';
            document.getElementById('d1').textContent = '9';
            document.getElementById('d2').textContent = '2';
            document.getElementById('d3').textContent = '4';
            lastTimeString = "09:24";

            // 1秒後自動觸發動畫切換到 09:25
            setTimeout(() => {
                setTimeString("09:25");
                lastTimeString = "09:25";
            }, 1000);
        });

        document.getElementById('btnNormal').addEventListener('click', () => {
            isTestMode = false;
            lastTimeString = "";
            updateClock();
        });

        // 啟動執行
        initLocation();
        renderList();
        setInterval(updateClock, 200);
        updateClock();
    </script>
</body>
</html>
