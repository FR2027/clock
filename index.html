<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FR Clock - Liquid Glass Edition</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: #030305;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* 動態液態玻璃光斑背景 */
        .ambient-glow {
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(29, 78, 216, 0.15) 0%, rgba(147, 51, 234, 0.08) 40%, transparent 70%);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1;
            pointer-events: none;
            filter: blur(80px);
            animation: pulseGlow 8s ease-in-out infinite alternate;
        }

        @keyframes pulseGlow {
            0% { transform: translate(-50%, -50%) scale(0.9); opacity: 0.6; }
            100% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
        }

        /* 全螢幕背景容器 */
        .fullscreen-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            z-index: 2;
        }

        /* 核心時鐘群組 */
        .clock-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 2;
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease;
        }

        /* 城市標題與日期 */
        .city-header {
            font-size: 2.2rem;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 8px;
            cursor: pointer;
            user-select: none;
            letter-spacing: 2px;
            transition: color 0.25s ease, transform 0.25s ease;
            text-align: center;
        }
        .city-header:hover {
            color: rgba(255, 255, 255, 0.95);
            transform: scale(1.02);
        }

        .date-display {
            font-size: 1.1rem;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.4);
            margin-bottom: 24px;
            letter-spacing: 1px;
            user-select: none;
        }

        /* iOS Liquid Glass 頂級質感時鐘數字區 */
        .time-display-wrapper {
            position: relative;
            padding: 20px 40px;
            border-radius: 40px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 
                0 30px 60px rgba(0, 0, 0, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.15),
                inset 0 -1px 0 rgba(255, 255, 255, 0.05);
            cursor: pointer;
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), background 0.3s ease;
        }

        .time-display-wrapper:hover {
            background: rgba(255, 255, 255, 0.06);
            transform: scale(1.01);
            border-color: rgba(255, 255, 255, 0.18);
            box-shadow: 
                0 40px 80px rgba(0, 0, 0, 0.7),
                inset 0 1px 0 rgba(255, 255, 255, 0.25),
                0 0 30px rgba(255, 255, 255, 0.05);
        }

        .time-display {
            font-size: 22vw;
            font-weight: 700;
            letter-spacing: -6px;
            color: #ffffff;
            font-variant-numeric: tabular-nums;
            line-height: 0.9;
            /* Liquid Glass 專屬立體多重光影陰影 */
            text-shadow: 
                0 2px 4px rgba(0, 0, 0, 0.8),
                0 0 40px rgba(255, 255, 255, 0.25),
                0 0 80px rgba(59, 130, 246, 0.15);
            user-select: none;
            display: flex;
            align-items: baseline;
            gap: 10px;
        }

        .seconds-span {
            font-size: 8vw;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.5);
            letter-spacing: -2px;
        }

        .ampm-span {
            font-size: 5vw;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.6);
            margin-left: 10px;
        }

        @media (min-width: 1200px) {
            .time-display {
                font-size: 240px;
            }
            .seconds-span {
                font-size: 90px;
            }
            .ampm-span {
                font-size: 60px;
            }
        }

        /* 提示標籤 */
        .hint-text {
            margin-top: 20px;
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.3);
            letter-spacing: 0.5px;
            user-select: none;
        }

        /* iOS 高級毛玻璃擬態彈窗 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-card {
            background: rgba(22, 22, 28, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 36px;
            width: 85%;
            max-width: 580px;
            max-height: 78vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 50px 100px rgba(0, 0, 0, 0.9), inset 0 1px 0 rgba(255, 255, 255, 0.15);
            transform: scale(0.92) translateY(15px);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .modal-overlay.active .modal-card {
            transform: scale(1) translateY(0);
        }

        .modal-header {
            padding: 24px 28px 18px;
            font-size: 1.25rem;
            font-weight: 600;
            color: #fff;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            justify-content: space-between;
            align-items: center;
            letter-spacing: 0.5px;
        }

        .modal-close {
            background: rgba(255, 255, 255, 0.08);
            border: none;
            color: #fff;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            font-size: 1.1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s, transform 0.2s;
        }
        .modal-close:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.05);
        }

        .timezone-list {
            overflow-y: auto;
            padding: 20px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .timezone-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 15px 18px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .timezone-item:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.25);
            transform: translateY(-2px);
        }

        .timezone-item.selected {
            background: rgba(10, 132, 255, 0.25);
            border-color: rgba(10, 132, 255, 0.6);
        }

        .tz-city {
            font-weight: 600;
            font-size: 1.05rem;
            color: #fff;
        }

        .tz-sub {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.45);
        }

        .timezone-list::-webkit-scrollbar {
            width: 6px;
        }
        .timezone-list::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 3px;
        }
    </style>
</head>
<body>

    <div class="ambient-glow"></div>

    <div class="fullscreen-container" id="container">
        <div class="clock-content" id="clockContent">
            <!-- 雙擊地名選擇時區 -->
            <div class="city-header" id="cityHeader" title="雙擊選擇時區">載入中...</div>
            <div class="date-display" id="dateDisplay">--/--/---- 週--</div>
            
            <!-- 點擊時鐘本體可切換 12/24 小時制 -->
            <div class="time-display-wrapper" id="timeWrapper" title="點擊切換 12/24 小時制">
                <div class="time-display" id="timeDisplay">
                    <span id="mainTime">00:00</span>
                    <span class="seconds-span" id="secondsSpan" style="display: none;">:00</span>
                    <span class="ampm-span" id="ampmSpan" style="display: none;">AM</span>
                </div>
            </div>
            
            <div class="hint-text">雙擊上方城市更改時區 ｜ 點擊時鐘切換 12/24 小時制</div>
        </div>
    </div>

    <!-- 24 時區選單彈窗 -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-card">
            <div class="modal-header">
                <span>選擇時區 (共 24 個全球城市)</span>
                <button class="modal-close" id="modalClose">&times;</button>
            </div>
            <div class="timezone-list" id="timezoneList"></div>
        </div>
    </div>

    <script>
        const timezones = [
            { name: "台北", zone: "Asia/Taipei", label: "UTC+8" },
            { name: "東京", zone: "Asia/Tokyo", label: "UTC+9" },
            { name: "首爾", zone: "Asia/Seoul", label: "UTC+9" },
            { name: "香港 / 新加坡", zone: "Asia/Hong_Kong", label: "UTC+8" },
            { name: "曼谷", zone: "Asia/Bangkok", label: "UTC+7" },
            { name: "孟買", zone: "Asia/Kolkata", label: "UTC+5:30" },
            { name: "杜拜", zone: "Asia/Dubai", label: "UTC+4" },
            { name: "莫斯科", zone: "Europe/Moscow", label: "UTC+3" },
            { name: "巴黎 / 羅馬", zone: "Europe/Paris", label: "UTC+1" },
            { name: "倫敦", zone: "Europe/London", label: "UTC+0" },
            { name: "雷克雅維克", zone: "Atlantic/Reykjavik", label: "UTC+0" },
            { name: "紐約", zone: "America/New_York", label: "UTC-5" },
            { name: "芝加哥", zone: "America/Chicago", label: "UTC-6" },
            { name: "丹佛", zone: "America/Denver", label: "UTC-7" },
            { name: "洛杉磯", zone: "America/Los_Angeles", label: "UTC-8" },
            { name: "溫哥華", zone: "America/Vancouver", label: "UTC-8" },
            { name: "聖保羅", zone: "America/Sao_Paulo", label: "UTC-3" },
            { name: "布宜諾斯艾利斯", zone: "America/Argentina/Buenos_Aires", label: "UTC-3" },
            { name: "雪梨", zone: "Australia/Sydney", label: "UTC+10" },
            { name: "奧克蘭", zone: "Pacific/Auckland", label: "UTC+12" },
            { name: "檀香山", zone: "Pacific/Honolulu", label: "UTC-10" },
            { name: "開羅", zone: "Africa/Cairo", label: "UTC+2" },
            { name: "墨西哥城", zone: "America/Mexico_City", label: "UTC-6" },
            { name: "多倫多", zone: "America/Toronto", label: "UTC-5" }
        ];

        let selectedTimezone = "Asia/Taipei";
        let selectedCityName = "台北";
        let is24Hour = true;
        let showSeconds = true; // 預設開啟秒數以展現動態感

        function initLocation() {
            try {
                const systemTz = Intl.DateTimeFormat().resolvedOptions().timeZone;
                const found = timezones.find(t => t.zone === systemTz);
                if (found) {
                    selectedTimezone = found.zone;
                    selectedCityName = found.name;
                }
            } catch (e) {}
            document.getElementById('cityHeader').textContent = selectedCityName;
        }

        function renderList() {
            const list = document.getElementById('timezoneList');
            list.innerHTML = '';
            timezones.forEach(t => {
                const item = document.createElement('div');
                item.className = `timezone-item ${selectedTimezone === t.zone ? 'selected' : ''}`;
                item.innerHTML = `
                    <div class="tz-city">${t.name}</div>
                    <div class="tz-sub">${t.zone} (${t.label})</div>
                `;
                item.addEventListener('click', () => {
                    selectedTimezone = t.zone;
                    selectedCityName = t.name;
                    document.getElementById('cityHeader').textContent = selectedCityName;
                    triggerTransitionAnim();
                    toggleModal(false);
                    renderList();
                });
                list.appendChild(item);
            });
        }

        function triggerTransitionAnim() {
            const content = document.getElementById('clockContent');
            content.style.transform = 'scale(0.92)';
            content.style.opacity = '0.2';
            setTimeout(() => {
                content.style.transform = 'scale(1)';
                content.style.opacity = '1';
            }, 300);
        }

        function updateClock() {
            const now = new Date();

            try {
                // 取得對應時區的時間字串
                const formatterOpts = {
                    timeZone: selectedTimezone,
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit',
                    hour12: !is24Hour
                };
                
                const formatter = new Intl.DateTimeFormat('en-US', formatterOpts);
                const parts = formatter.formatToParts(now);
                
                let h = "00", m = "00", s = "00", dayPeriod = "";
                parts.forEach(p => {
                    if (p.type === 'hour') h = p.value;
                    if (p.type === 'minute') m = p.value;
                    if (p.type === 'second') s = p.value;
                    if (p.type === 'dayPeriod') dayPeriod = p.value;
                });

                // 更新日期
                const dateFormatter = new Intl.DateTimeFormat('zh-TW', {
                    timeZone: selectedTimezone,
                    year: 'numeric',
                    month: '2-digit',
                    day: '2-digit',
                    weekday: 'short'
                });
                document.getElementById('dateDisplay').textContent = dateFormatter.format(now);

                // 更新時間內容
                document.getElementById('mainTime').textContent = `${h}:${m}`;
                
                const secEl = document.getElementById('secondsSpan');
                if (showSeconds) {
                    secEl.style.display = 'inline';
                    secEl.textContent = `:${s}`;
                } else {
                    secEl.style.display = 'none';
                }

                const ampmEl = document.getElementById('ampmSpan');
                if (!is24Hour) {
                    ampmEl.style.display = 'inline';
                    ampmEl.textContent = dayPeriod;
                } else {
                    ampmEl.style.display = 'none';
                }

            } catch (e) {
                document.getElementById('mainTime').textContent = "00:00";
            }
        }

        // 互動控制
        const overlay = document.getElementById('modalOverlay');
        const cityHeader = document.getElementById('cityHeader');
        const closeBtn = document.getElementById('modalClose');
        const timeWrapper = document.getElementById('timeWrapper');

        function toggleModal(show) {
            if (show) {
                overlay.classList.add('active');
            } else {
                overlay.classList.remove('active');
            }
        }

        cityHeader.addEventListener('dblclick', () => toggleModal(true));
        closeBtn.addEventListener('click', () => toggleModal(false));
        overlay.addEventListener('click', (e) => {
            if (e.target === overlay) toggleModal(false);
        });

        // 點擊時鐘切換 12/24 小時制
        timeWrapper.addEventListener('click', () => {
            is24Hour = !is24Hour;
            triggerTransitionAnim();
        });

        // 初始化執行
        initLocation();
        renderList();
        setInterval(updateClock, 100);
        updateClock();
    </script>
</body>
</html>
