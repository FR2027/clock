<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iOS 27 Luxury StandBy Clock</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* 仿 iOS 精緻圓角外框與粗體邊界 (包含精確的四邊格狀精密刻度) */
        .bezel-frame {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            bottom: 20px;
            border: 3px solid rgba(255, 255, 255, 0.18);
            border-radius: 36px;
            pointer-events: none;
            box-shadow: inset 0 0 40px rgba(255, 255, 255, 0.03), 0 0 40px rgba(0, 0, 0, 0.8);
        }

        /* 頂部與底部刻度群組 */
        .ticks-x {
            position: absolute;
            left: 50px;
            right: 50px;
            height: 16px;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
        }
        .ticks-x.top { top: 30px; }
        .ticks-x.bottom { bottom: 30px; }

        .tick-v {
            width: 2px;
            height: 8px;
            background-color: rgba(255, 255, 255, 0.3);
            border-radius: 1px;
        }
        .tick-v.major {
            height: 14px;
            width: 3px;
            background-color: rgba(255, 255, 255, 0.7);
        }

        /* 左右兩側刻度群組 */
        .ticks-y {
            position: absolute;
            top: 50px;
            bottom: 50px;
            width: 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            pointer-events: none;
        }
        .ticks-y.left { left: 30px; }
        .ticks-y.right { right: 30px; }

        .tick-h {
            height: 2px;
            width: 8px;
            background-color: rgba(255, 255, 255, 0.3);
            border-radius: 1px;
        }
        .tick-h.major {
            width: 14px;
            height: 3px;
            background-color: rgba(255, 255, 255, 0.7);
        }

        /* 核心內容完美置中，並具備流暢液態轉場動畫 */
        .clock-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.5s ease;
        }

        /* 上方資訊區（城市雙擊互動） */
        .header-group {
            margin-bottom: -2vw;
            cursor: pointer;
            user-select: none;
            transition: transform 0.2s ease, opacity 0.2s ease;
        }
        .header-group:hover {
            transform: scale(1.03);
            opacity: 0.9;
        }

        .city-name {
            font-size: 2.5vw;
            font-weight: 800; /* 極致粗體 */
            letter-spacing: 1.5px;
            color: rgba(255, 255, 255, 0.95);
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        /* 中央巨大粗體時間 */
        .time-display {
            font-size: 24vw;
            font-weight: 800; /* Apple 頂級粗體數字 */
            letter-spacing: -6px;
            color: #ffffff;
            font-variant-numeric: tabular-nums;
            line-height: 1;
            text-shadow: 0 0 80px rgba(255, 255, 255, 0.25);
            user-select: none;
        }

        /* 隱藏式時區選單模態框 (Apple Liquid Glass 玻璃擬態風格) */
        .modal-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-card {
            background: rgba(30, 30, 35, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 28px;
            width: 90%;
            max-width: 600px;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.7);
            transform: scale(0.95);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .modal-overlay.active .modal-card {
            transform: scale(1);
        }

        .modal-header {
            padding: 24px 30px 16px;
            font-size: 1.5rem;
            font-weight: 700;
            color: #ffffff;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-close {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: #fff;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-size: 1.1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }
        .modal-close:hover {
            background: rgba(255, 255, 255, 0.25);
        }

        .timezone-list {
            overflow-y: auto;
            padding: 12px 20px 24px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .timezone-item {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 14px 18px;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .timezone-item:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        .timezone-item.selected {
            background: rgba(10, 132, 255, 0.25);
            border-color: rgba(10, 132, 255, 0.6);
        }

        .tz-city {
            font-weight: 700;
            font-size: 1.1rem;
            color: #ffffff;
        }

        .tz-name {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.5);
        }

        .timezone-list::-webkit-scrollbar {
            width: 6px;
        }
        .timezone-list::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
        }

        @keyframes iosFadeIn {
            from { opacity: 0; transform: scale(0.98); }
            to { opacity: 1; transform: scale(1); }
        }
        .clock-container {
            animation: iosFadeIn 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>
</head>
<body>

    <!-- 外框線與精密格狀刻度 -->
    <div class="bezel-frame"></div>
    <div class="ticks-x top" id="ticksTop"></div>
    <div class="ticks-x bottom" id="ticksBottom"></div>
    <div class="ticks-y left" id="ticksLeft"></div>
    <div class="ticks-y right" id="ticksRight"></div>

    <!-- 核心時鐘：完美正中央 -->
    <div class="clock-container" id="clockContainer">
        <div class="header-group" id="headerGroup" title="雙擊選擇時區">
            <div class="city-name" id="cityName">載入中...</div>
        </div>
        <div class="time-display" id="timeDisplay">00:00</div>
    </div>

    <!-- 隱藏式 24 時區選單 -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-card">
            <div class="modal-header">
                <span>選擇時區 (24個全球城市)</span>
                <button class="modal-close" id="modalClose">&times;</button>
            </div>
            <div class="timezone-list" id="timezoneList"></div>
        </div>
    </div>

    <script>
        // 24 個全球代表性時區清單
        const timezones = [
            { name: "台北 / 北京", zone: "Asia/Taipei", label: "UTC+8" },
            { name: "東京", zone: "Asia/Tokyo", label: "UTC+9" },
            { name: "首爾", zone: "Asia/Seoul", label: "UTC+9" },
            { name: "香港 / 新加坡", zone: "Asia/Hong_Kong", label: "UTC+8" },
            { name: "曼谷", zone: "Asia/Bangkok", label: "UTC+7" },
            { name: "孟買", zone: "Asia/Kolkata", label: "UTC+5:30" },
            { name: "杜拜", zone: "Asia/Dubai", label: "UTC+4" },
            { name: "莫斯科", zone: "Europe/Moscow", label: "UTC+3" },
            { name: "巴黎 / 羅馬", zone: "Europe/Paris", label: "UTC+1" },
            { name: "倫敦", zone: "Europe/London", label: "UTC+0" },
            { name: "雷克雅維克", zone: "Atlantic/Reykjavik", label: "UTC+0" },
            { name: "紐約", zone: "America/New_York", label: "UTC-5" },
            { name: "芝加哥", zone: "America/Chicago", label: "UTC-6" },
            { name: "丹佛", zone: "America/Denver", label: "UTC-7" },
            { name: "洛杉磯", zone: "America/Los_Angeles", label: "UTC-8" },
            { name: "溫哥華", zone: "America/Vancouver", label: "UTC-8" },
            { name: "聖保羅", zone: "America/Sao_Paulo", label: "UTC-3" },
            { name: "布宜諾斯艾利斯", zone: "America/Argentina/Buenos_Aires", label: "UTC-3" },
            { name: "雪梨", zone: "Australia/Sydney", label: "UTC+10" },
            { name: "奧克蘭", zone: "Pacific/Auckland", label: "UTC+12" },
            { name: "檀香山", zone: "Pacific/Honolulu", label: "UTC-10" },
            { name: "開羅", zone: "Africa/Cairo", label: "UTC+2" },
            { name: "墨西哥城", zone: "America/Mexico_City", label: "UTC-6" },
            { name: "多倫多", zone: "America/Toronto", label: "UTC-5" }
        ];

        let selectedTimezone = null;
        let selectedCityName = "";

        // 預設抓取目前位置
        function initDefaultLocation() {
            try {
                const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
                const found = timezones.find(t => t.zone === tz);
                if (found) {
                    selectedCityName = found.name.split('/')[0].trim();
                } else {
                    selectedCityName = tz.split('/').pop().replace(/_/g, ' ');
                }
            } catch (e) {
                selectedCityName = "當地時間";
            }
            document.getElementById('cityName').textContent = selectedCityName;
        }

        // 動態生成刻度
        function createTicks() {
            const countX = 28;
            const countY = 14;

            const tTop = document.getElementById('ticksTop');
            const tBottom = document.getElementById('ticksBottom');
            const tLeft = document.getElementById('ticksLeft');
            const tRight = document.getElementById('ticksRight');

            for (let i = 0; i <= countX; i++) {
                const isMajor = i % 4 === 0;
                tTop.innerHTML += `<div class="tick-v ${isMajor ? 'major' : ''}"></div>`;
                tBottom.innerHTML += `<div class="tick-v ${isMajor ? 'major' : ''}"></div>`;
            }

            for (let i = 0; i <= countY; i++) {
                const isMajor = i % 4 === 0;
                tLeft.innerHTML += `<div class="tick-h ${isMajor ? 'major' : ''}"></div>`;
                tRight.innerHTML += `<div class="tick-h ${isMajor ? 'major' : ''}"></div>`;
            }
        }

        // 渲染時區選單
        function renderTimezoneList() {
            const listEl = document.getElementById('timezoneList');
            listEl.innerHTML = '';

            timezones.forEach(tz => {
                const item = document.createElement('div');
                item.className = `timezone-item ${selectedTimezone === tz.zone ? 'selected' : ''}`;
                item.innerHTML = `
                    <div class="tz-city">${tz.name}</div>
                    <div class="tz-name">${tz.zone} (${tz.label})</div>
                `;
                item.addEventListener('click', () => {
                    selectedTimezone = tz.zone;
                    selectedCityName = tz.name.split('/')[0].trim();
                    document.getElementById('cityName').textContent = selectedCityName;
                    
                    triggerTransitionEffect();
                    closeModal();
                    renderTimezoneList();
                });
                listEl.appendChild(item);
            });
        }

        function triggerTransitionEffect() {
            const container = document.getElementById('clockContainer');
            container.style.transform = 'scale(0.96)';
            container.style.opacity = '0.4';
            setTimeout(() => {
                container.style.transform = 'scale(1)';
                container.style.opacity = '1';
            }, 300);
        }

        function updateClock() {
            const now = new Date();
            let timeString = "";

            try {
                if (selectedTimezone) {
                    const options = {
                        timeZone: selectedTimezone,
                        hour: '2-digit',
                        minute: '2-digit',
                        hour12: false
                    };
                    timeString = new Intl.DateTimeFormat('en-GB', options).format(now);
                } else {
                    const hours = String(now.getHours()).padStart(2, '0');
                    const minutes = String(now.getMinutes()).padStart(2, '0');
                    timeString = `${hours}:${minutes}`;
                }
            } catch (e) {
                const hours = String(now.getHours()).padStart(2, '0');
                const minutes = String(now.getMinutes()).padStart(2, '0');
                timeString = `${hours}:${minutes}`;
            }

            const timeEl = document.getElementById('timeDisplay');
            if (timeEl.textContent !== timeString) {
                timeEl.textContent = timeString;
            }
        }

        const headerGroup = document.getElementById('headerGroup');
        const modalOverlay = document.getElementById('modalOverlay');
        const modalClose = document.getElementById('modalClose');

        headerGroup.addEventListener('dblclick', () => {
            modalOverlay.classList.add('active');
        });

        modalClose.addEventListener('click', closeModal);
        modalOverlay.addEventListener('click', (e) => {
            if (e.target === modalOverlay) closeModal();
        });

        function closeModal() {
            modalOverlay.classList.remove('active');
        }

        createTicks();
        initDefaultLocation();
        renderTimezoneList();
        setInterval(updateClock, 100);
        updateClock();
    </script>
</body>
</html>
