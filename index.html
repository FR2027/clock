<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iOS Aesthetic Fullscreen Clock</title>
    <!-- 引入 Apple 常用且極具現代感的 SF Pro 體系字型 -->
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            cursor: pointer;
            transition: background 0.5s ease;
        }

        /* 呼吸燈微光背景，營造高階 OLED 質感 */
        body::before {
            content: '';
            position: absolute;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at 50% 50%, rgba(30, 30, 35, 0.4) 0%, rgba(0, 0, 0, 0.9) 80%);
            z-index: -1;
        }

        .container {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            animation: fadeIn 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* iOS 鎖定畫面高級日期風格 */
        .date {
            font-size: 1.25rem;
            font-weight: 500;
            letter-spacing: 2px;
            color: rgba(235, 235, 245, 0.6);
            text-transform: uppercase;
        }

        /* 主時鐘：運用精緻的數字排版與蘋果風格字重 */
        .time-wrapper {
            display: flex;
            align-items: baseline;
            gap: 8px;
        }

        .time {
            font-size: 12vw;
            font-weight: 300;
            letter-spacing: -3px;
            color: #f5f5f7;
            /* 模擬蘋果高階玻璃擬態與極細微暈影 */
            text-shadow: 0 0 40px rgba(255, 255, 255, 0.15);
            font-variant-numeric: tabular-nums;
        }

        .seconds {
            font-size: 3.5vw;
            font-weight: 300;
            color: rgba(235, 235, 245, 0.4);
            font-variant-numeric: tabular-nums;
            margin-bottom: 2.2vw;
        }

        /* 底部提示與控制按鈕（平時半隱藏，滑鼠移入時顯現） */
        .footer-hint {
            position: absolute;
            bottom: 30px;
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.2);
            letter-spacing: 1px;
            transition: opacity 0.4s ease;
            opacity: 0;
        }

        body:hover .footer-hint {
            opacity: 1;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.98);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="date" id="date">--</div>
        <div class="time-wrapper">
            <div class="time" id="time">00:00</div>
            <div class="seconds" id="seconds">00</div>
        </div>
    </div>

    <div class="footer-hint">點擊任意處切換全螢幕</div>

    <script>
        function updateClock() {
            const now = new Date();

            // 格式化日期：例如 "8月23日 星期日"
            const options = { month: 'long', day: 'numeric', weekday: 'long' };
            const dateString = now.toLocaleDateString('zh-TW', options);
            document.getElementById('date').textContent = dateString;

            // 格式化時間 (24小時制或精準數字)
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');

            document.getElementById('time').textContent = `${hours}:${minutes}`;
            document.getElementById('seconds').textContent = seconds;
        }

        // 每秒更新
        setInterval(updateClock, 1000);
        updateClock();

        // 點擊畫面自動切換全螢幕功能
        document.body.addEventListener('click', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch((err) => {
                    console.log(`無法切換全螢幕: ${err.message}`);
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        });
    </script>

</body>
</html>
