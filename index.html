<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fullscreen iOS Widget Clock</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* 全螢幕主容器（帶有 iOS 質感粗框與邊框刻度） */
        .fullscreen-widget {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000000;
            border: 12px solid rgba(255, 255, 255, 0.18);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* 沿著全螢幕邊框內側排列的精密斜線刻度 */
        .edge-tick {
            position: absolute;
            width: 12px;
            height: 4px;
            background-color: rgba(255, 255, 255, 0.3);
            border-radius: 2px;
            pointer-events: none;
        }
        .edge-tick.major {
            width: 20px;
            height: 5px;
            background-color: rgba(255, 255, 255, 0.75);
        }

        /* 內容群組 */
        .clock-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 2;
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease;
        }

        /* 城市名稱（點擊切換時區） */
        .city-header {
            font-size: 3rem;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.65);
            margin-bottom: 10px;
            cursor: pointer;
            user-select: none;
            transition: color 0.2s, transform 0.2s;
            letter-spacing: 2px;
        }
        .city-header:hover {
            color: #ffffff;
            transform: scale(1.03);
        }

        /* 超大時間數字 */
        .time-display {
            font-size: 32vw;
            font-weight: 800;
            letter-spacing: -10px;
            color: #ffffff;
            font-variant-numeric: tabular-nums;
            line-height: 0.9;
            user-select: none;
        }

        @media (min-width: 1200px) {
            .time-display {
                font-size: 380px;
            }
            .city-header {
                font-size: 3.5rem;
            }
        }

        /* 24 時區選單 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-card {
            background: rgba(30, 30, 35, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 32px;
            width: 90%;
            max-width: 600px;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.9);
            transform: scale(0.95);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .modal-overlay.active .modal-card {
            transform: scale(1);
        }

        .modal-header {
            padding: 24px 28px 16px;
            font-size: 1.4rem;
            font-weight: 700;
            color: #fff;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-close {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: #fff;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            font-size: 1.2rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }
        .modal-close:hover {
            background: rgba(255, 255, 255, 0.25);
        }

        .timezone-list {
            overflow-y: auto;
            padding: 20px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .timezone-item {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 16px 18px;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .timezone-item:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .timezone-item.selected {
            background: rgba(10, 132, 255, 0.35);
            border-color: rgba(10, 132, 255, 0.7);
        }

        .tz-city {
            font-weight: 700;
            font-size: 1.1rem;
            color: #fff;
        }

        .tz-sub {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.5);
        }

        .timezone-list::-webkit-scrollbar {
            width: 6px;
        }
        .timezone-list::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
        }
    </style>
</head>
<body>

    <div class="fullscreen-widget" id="widgetContainer">
        <!-- 內容區 -->
        <div class="clock-content" id="clockContent">
            <div class="city-header" id="cityHeader" title="點擊選擇時區">載入中...</div>
            <div class="time-display" id="timeDisplay">00:00</div>
        </div>
    </div>

    <!-- 24 時區選單 -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-card">
            <div class="modal-header">
                <span>選擇時區 (共 24 個全球城市)</span>
                <button class="modal-close" id="modalClose">&times;</button>
            </div>
            <div class="timezone-list" id="timezoneList"></div>
        </div>
    </div>

    <script>
        const timezones = [
            { name: "台北 / 北京", zone: "Asia/Taipei", label: "UTC+8" },
            { name: "東京", zone: "Asia/Tokyo", label: "UTC+9" },
            { name: "首爾", zone: "Asia/Seoul", label: "UTC+9" },
            { name: "香港 / 新加坡", zone: "Asia/Hong_Kong", label: "UTC+8" },
            { name: "曼谷", zone: "Asia/Bangkok", label: "UTC+7" },
            { name: "孟買", zone: "Asia/Kolkata", label: "UTC+5:30" },
            { name: "杜拜", zone: "Asia/Dubai", label: "UTC+4" },
            { name: "莫斯科", zone: "Europe/Moscow", label: "UTC+3" },
            { name: "巴黎 / 羅馬", zone: "Europe/Paris", label: "UTC+1" },
            { name: "倫敦", zone: "Europe/London", label: "UTC+0" },
            { name: "雷克雅維克", zone: "Atlantic/Reykjavik", label: "UTC+0" },
            { name: "紐約", zone: "America/New_York", label: "UTC-5" },
            { name: "芝加哥", zone: "America/Chicago", label: "UTC-6" },
            { name: "丹佛", zone: "America/Denver", label: "UTC-7" },
            { name: "洛杉磯", zone: "America/Los_Angeles", label: "UTC-8" },
            { name: "溫哥華", zone: "America/Vancouver", label: "UTC-8" },
            { name: "聖保羅", zone: "America/Sao_Paulo", label: "UTC-3" },
            { name: "布宜諾斯艾利斯", zone: "America/Argentina/Buenos_Aires", label: "UTC-3" },
            { name: "雪梨", zone: "Australia/Sydney", label: "UTC+10" },
            { name: "奧克蘭", zone: "Pacific/Auckland", label: "UTC+12" },
            { name: "檀香山", zone: "Pacific/Honolulu", label: "UTC-10" },
            { name: "開羅", zone: "Africa/Cairo", label: "UTC+2" },
            { name: "墨西哥城", zone: "America/Mexico_City", label: "UTC-6" },
            { name: "多倫多", zone: "America/Toronto", label: "UTC-5" }
        ];

        let selectedTimezone = null;
        let selectedCityName = "";

        function initLocation() {
            try {
                const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
                const found = timezones.find(t => t.zone === tz);
                if (found) {
                    selectedCityName = found.name.split('/')[0].trim();
                    selectedTimezone = found.zone;
                } else {
                    selectedCityName = "台北";
                    selectedTimezone = "Asia/Taipei";
                }
            } catch (e) {
                selectedCityName = "台北";
                selectedTimezone = "Asia/Taipei";
            }
            document.getElementById('cityHeader').textContent = selectedCityName;
        }

        // 生成全螢幕邊框內側的刻度
        function generateTicks() {
            const container = document.getElementById('widgetContainer');
            // 上下左右各排佈刻度
            const countPerSide = 18; 

            // 上邊
            for (let i = 0; i <= countPerSide; i++) {
                createTick((i / countPerSide) * 100, 2.5, 0);
            }
            // 下邊
            for (let i = 0; i <= countPerSide; i++) {
                createTick((i / countPerSide) * 100, 97.5, 0);
            }
            // 左邊
            for (let i = 1; i < countPerSide; i++) {
                createTick(2.5, (i / countPerSide) * 100, 90);
            }
            // 右邊
            for (let i = 1; i < countPerSide; i++) {
                createTick(97.5, (i / countPerSide) * 100, 90);
            }
        }

        function createTick(leftPct, topPct, rotateDeg) {
            const container = document.getElementById('widgetContainer');
            const tick = document.createElement('div');
            // 讓部分刻度變大（類似錶盤主刻度）
            const isMajor = (Math.round(leftPct + topPct) % 5 === 0);
            tick.className = `edge-tick ${isMajor ? 'major' : ''}`;
            tick.style.left = `${leftPct}%`;
            tick.style.top = `${topPct}%`;
            tick.style.transform = `translate(-50%, -50%) rotate(${rotateDeg}deg)`;
            container.appendChild(tick);
        }

        function renderList() {
            const list = document.getElementById('timezoneList');
            list.innerHTML = '';
            timezones.forEach(t => {
                const item = document.createElement('div');
                item.className = `timezone-item ${selectedTimezone === t.zone ? 'selected' : ''}`;
                item.innerHTML = `
                    <div class="tz-city">${t.name}</div>
                    <div class="tz-sub">${t.zone} (${t.label})</div>
                `;
                item.addEventListener('click', () => {
                    selectedTimezone = t.zone;
                    selectedCityName = t.name.split('/')[0].trim();
                    document.getElementById('cityHeader').textContent = selectedCityName;
                    
                    triggerAnim();
                    toggleModal(false);
                    renderList();
                });
                list.appendChild(item);
            });
        }

        function triggerAnim() {
            const content = document.getElementById('clockContent');
            content.style.transform = 'scale(0.95)';
            content.style.opacity = '0.2';
            setTimeout(() => {
                content.style.transform = 'scale(1)';
                content.style.opacity = '1';
            }, 250);
        }

        function updateTime() {
            const now = new Date();
            let timeStr = "";
            try {
                timeStr = new Intl.DateTimeFormat('en-GB', {
                    timeZone: selectedTimezone,
                    hour: '2-digit',
                    minute: '2-digit',
                    hour12: false
                }).format(now);
            } catch (e) {
                const h = String(now.getHours()).padStart(2, '0');
                const m = String(now.getMinutes()).padStart(2, '0');
                timeStr = `${h}:${m}`;
            }

            const timeEl = document.getElementById('timeDisplay');
            if (timeEl.textContent !== timeStr) {
                timeEl.textContent = timeStr;
            }
        }

        const overlay = document.getElementById('modalOverlay');
        const cityHeader = document.getElementById('cityHeader');
        const closeBtn = document.getElementById('modalClose');

        function toggleModal(show) {
            if (show) {
                overlay.classList.add('active');
            } else {
                overlay.classList.remove('active');
            }
        }

        cityHeader.addEventListener('click', () => toggleModal(true));
        closeBtn.addEventListener('click', () => toggleModal(false));
        overlay.addEventListener('click', (e) => {
            if (e.target === overlay) toggleModal(false);
        });

        generateTicks();
        initLocation();
        renderList();
        setInterval(updateTime, 100);
        updateTime();
    </script>
</body>
</html>
