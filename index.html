<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FR Clock - iOS StandBy Liquid Glass</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
            /* iOS 待機緩慢變色的高質感漸層背景 */
            background: linear-gradient(135deg, #050508, #120c1f, #070e17, #000000);
            background-size: 400% 400%;
            animation: standbyGradient 25s ease infinite;
        }

        @keyframes standbyGradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* 全螢幕背景容器 */
        .fullscreen-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* 核心時鐘群組 */
        .clock-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 2;
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease;
        }

        /* 雙擊觸發的城市標題 */
        .city-header {
            font-size: 2.5rem;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.45);
            margin-bottom: 16px;
            cursor: pointer;
            user-select: none;
            letter-spacing: 2px;
            transition: color 0.25s ease, transform 0.25s ease;
        }
        .city-header:hover {
            color: rgba(255, 255, 255, 0.85);
            transform: scale(1.02);
        }
        .city-header:active {
            transform: scale(0.97);
        }

        /* 頂級 40% 半透明 Liquid Glass 質感大時間數字 */
        .time-display {
            font-size: 30vw;
            font-weight: 700;
            letter-spacing: -8px;
            /* 40% 半透明白色，呈現通透的液態玻璃感 */
            color: rgba(255, 255, 255, 0.4);
            font-variant-numeric: tabular-nums;
            line-height: 0.9;
            /* 結合透光陰影與微弱邊緣發光，營造真實玻璃字體質感 */
            text-shadow: 
                0 0 40px rgba(255, 255, 255, 0.15),
                0 0 80px rgba(100, 150, 255, 0.08),
                0 2px 5px rgba(0, 0, 0, 0.8);
            user-select: none;
            backdrop-filter: blur(1px);
            -webkit-backdrop-filter: blur(1px);
        }

        @media (min-width: 1200px) {
            .time-display {
                font-size: 340px;
            }
        }

        /* 蘋果高級毛玻璃擬態時區選單 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(50px);
            -webkit-backdrop-filter: blur(50px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-card {
            background: rgba(20, 20, 25, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 36px;
            width: 85%;
            max-width: 580px;
            max-height: 78vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 50px 100px rgba(0, 0, 0, 0.9);
            transform: scale(0.92) translateY(15px);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .modal-overlay.active .modal-card {
            transform: scale(1) translateY(0);
        }

        .modal-header {
            padding: 24px 28px 18px;
            font-size: 1.25rem;
            font-weight: 600;
            color: #fff;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            justify-content: space-between;
            align-items: center;
            letter-spacing: 0.5px;
        }

        .modal-close {
            background: rgba(255, 255, 255, 0.08);
            border: none;
            color: #fff;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            font-size: 1.1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s, transform 0.2s;
        }
        .modal-close:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.05);
        }

        .timezone-list {
            overflow-y: auto;
            padding: 20px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .timezone-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 15px 18px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .timezone-item:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.25);
            transform: translateY(-2px);
        }

        .timezone-item.selected {
            background: rgba(10, 132, 255, 0.25);
            border-color: rgba(10, 132, 255, 0.6);
        }

        .tz-city {
            font-weight: 600;
            font-size: 1.05rem;
            color: #fff;
        }

        .tz-sub {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.45);
        }

        .timezone-list::-webkit-scrollbar {
            width: 6px;
        }
        .timezone-list::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 3px;
        }
    </style>
</head>
<body>

    <div class="fullscreen-container" id="container">
        <!-- 核心時鐘區 -->
        <div class="clock-content" id="clockContent">
            <!-- 雙擊地名呼叫隱藏選單 -->
            <div class="city-header" id="cityHeader" title="對著地名「雙擊兩下」選擇時區">載入中...</div>
            <div class="time-display" id="timeDisplay">00:00</div>
        </div>
    </div>

    <!-- 24 時區選單彈窗 -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-card">
            <div class="modal-header">
                <span>選擇時區 (共 24 個全球城市)</span>
                <button class="modal-close" id="modalClose">&times;</button>
            </div>
            <div class="timezone-list" id="timezoneList"></div>
        </div>
    </div>

    <script>
        // 24 個全球經典時區
        const timezones = [
            { name: "台北", zone: "Asia/Taipei", label: "UTC+8" },
            { name: "東京", zone: "Asia/Tokyo", label: "UTC+9" },
            { name: "首爾", zone: "Asia/Seoul", label: "UTC+9" },
            { name: "香港 / 新加坡", zone: "Asia/Hong_Kong", label: "UTC+8" },
            { name: "曼谷", zone: "Asia/Bangkok", label: "UTC+7" },
            { name: "孟買", zone: "Asia/Kolkata", label: "UTC+5:30" },
            { name: "杜拜", zone: "Asia/Dubai", label: "UTC+4" },
            { name: "莫斯科", zone: "Europe/Moscow", label: "UTC+3" },
            { name: "巴黎 / 羅馬", zone: "Europe/Paris", label: "UTC+1" },
            { name: "倫敦", zone: "Europe/London", label: "UTC+0" },
            { name: "雷克雅維克", zone: "Atlantic/Reykjavik", label: "UTC+0" },
            { name: "紐約", zone: "America/New_York", label: "UTC-5" },
            { name: "芝加哥", zone: "America/Chicago", label: "UTC-6" },
            { name: "丹佛", zone: "America/Denver", label: "UTC-7" },
            { name: "洛杉磯", zone: "America/Los_Angeles", label: "UTC-8" },
            { name: "溫哥華", zone: "America/Vancouver", label: "UTC-8" },
            { name: "聖保羅", zone: "America/Sao_Paulo", label: "UTC-3" },
            { name: "布宜諾斯艾利斯", zone: "America/Argentina/Buenos_Aires", label: "UTC-3" },
            { name: "雪梨", zone: "Australia/Sydney", label: "UTC+10" },
            { name: "奧克蘭", zone: "Pacific/Auckland", label: "UTC+12" },
            { name: "檀香山", zone: "Pacific/Honolulu", label: "UTC-10" },
            { name: "開羅", zone: "Africa/Cairo", label: "UTC+2" },
            { name: "墨西哥城", zone: "America/Mexico_City", label: "UTC-6" },
            { name: "多倫多", zone: "America/Toronto", label: "UTC-5" }
        ];

        let selectedTimezone = null;
        let selectedCityName = "";

        // 初始化：預設抓取目前裝置所在位置
        function initLocation() {
            try {
                const systemTz = Intl.DateTimeFormat().resolvedOptions().timeZone;
                const found = timezones.find(t => t.zone === systemTz);
                if (found) {
                    selectedTimezone = found.zone;
                    selectedCityName = found.name;
                } else {
                    selectedTimezone = "Asia/Taipei";
                    selectedCityName = "台北";
                }
            } catch (e) {
                selectedTimezone = "Asia/Taipei";
                selectedCityName = "台北";
            }
            document.getElementById('cityHeader').textContent = selectedCityName;
        }

        // 渲染時區清單
        function renderList() {
            const list = document.getElementById('timezoneList');
            list.innerHTML = '';
            timezones.forEach(t => {
                const item = document.createElement('div');
                item.className = `timezone-item ${selectedTimezone === t.zone ? 'selected' : ''}`;
                item.innerHTML = `
                    <div class="tz-city">${t.name}</div>
                    <div class="tz-sub">${t.zone} (${t.label})</div>
                `;
                item.addEventListener('click', () => {
                    selectedTimezone = t.zone;
                    selectedCityName = t.name;
                    document.getElementById('cityHeader').textContent = selectedCityName;
                    
                    triggerTransitionAnim();
                    toggleModal(false);
                    renderList();
                });
                list.appendChild(item);
            });
        }

        function triggerTransitionAnim() {
            const content = document.getElementById('clockContent');
            content.style.transform = 'scale(0.92)';
            content.style.opacity = '0.2';
            setTimeout(() => {
                content.style.transform = 'scale(1)';
                content.style.opacity = '1';
            }, 300);
        }

        // 更新時鐘
        function updateClock() {
            const now = new Date();
            let timeStr = "";

            try {
                const formatter = new Intl.DateTimeFormat('en-GB', {
                    timeZone: selectedTimezone,
                    hour: '2-digit',
                    minute: '2-digit',
                    hour12: false
                });
                timeStr = formatter.format(now);
            } catch (e) {
                const h = String(now.getHours()).padStart(2, '0');
                const m = String(now.getMinutes()).padStart(2, '0');
                timeStr = `${h}:${m}`;
            }

            const timeEl = document.getElementById('timeDisplay');
            if (timeEl.textContent !== timeStr) {
                timeEl.textContent = timeStr;
            }
        }

        // 彈窗雙擊互動控制
        const overlay = document.getElementById('modalOverlay');
        const cityHeader = document.getElementById('cityHeader');
        const closeBtn = document.getElementById('modalClose');

        function toggleModal(show) {
            if (show) {
                overlay.classList.add('active');
            } else {
                overlay.classList.remove('active');
            }
        }

        // 雙擊 (dblclick) 觸發隱藏選單
        cityHeader.addEventListener('dblclick', () => {
            toggleModal(true);
        });

        closeBtn.addEventListener('click', () => toggleModal(false));
        overlay.addEventListener('click', (e) => {
            if (e.target === overlay) toggleModal(false);
        });

        // 啟動執行
        initLocation();
        renderList();
        setInterval(updateClock, 200);
        updateClock();
    </script>
</body>
</html>
