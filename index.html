<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iOS 27 Clock</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* 擬真 Apple 智慧型立架/StandBy 橫向框線或外框粗體邊界裝飾 */
        .bezel-frame {
            position: absolute;
            top: 24px;
            left: 24px;
            right: 24px;
            bottom: 24px;
            border: 2px solid rgba(255, 255, 255, 0.12);
            border-radius: 28px;
            pointer-events: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 16px;
        }

        /* 邊邊精緻刻度裝飾（Apple 錶盤/儀表板高階質感） */
        .tick-marks-top, .tick-marks-bottom {
            position: absolute;
            left: 60px;
            right: 60px;
            height: 10px;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
        }

        .tick-marks-top {
            top: 36px;
        }

        .tick-marks-bottom {
            bottom: 36px;
        }

        .tick {
            width: 2px;
            height: 8px;
            background-color: rgba(255, 255, 255, 0.25);
        }

        .tick.major {
            height: 14px;
            background-color: rgba(255, 255, 255, 0.5);
            width: 3px;
        }

        /* 左右兩側邊框刻度 */
        .tick-marks-left, .tick-marks-right {
            position: absolute;
            top: 60px;
            bottom: 60px;
            width: 10px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            pointer-events: none;
        }

        .tick-marks-left {
            left: 36px;
        }

        .tick-marks-right {
            right: 36px;
        }

        .tick-h {
            height: 2px;
            width: 8px;
            background-color: rgba(255, 255, 255, 0.25);
        }

        .tick-h.major {
            width: 14px;
            background-color: rgba(255, 255, 255, 0.5);
            height: 3px;
        }

        /* 橫向佈局主體 */
        .widget-landscape {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            padding-left: 70px;
            padding-top: 20px;
            width: 100%;
            max-width: 1200px;
        }

        /* 左上角城市與日期高質感粗體 */
        .header-info {
            display: flex;
            align-items: baseline;
            gap: 16px;
            margin-bottom: -4px;
        }

        .city {
            font-size: 2.2rem;
            font-weight: 750; /* 超粗體 */
            letter-spacing: 1px;
            color: rgba(255, 255, 255, 0.9);
        }

        .date-sub {
            font-size: 1.3rem;
            font-weight: 600; /* 粗體 */
            color: rgba(235, 235, 245, 0.5);
            letter-spacing: 0.5px;
        }

        /* 時間主體：超粗體極大化橫向展開 */
        .time-container {
            display: flex;
            align-items: baseline;
        }

        .time {
            font-size: 19vw;
            font-weight: 750; /* Apple 頂級粗體數字 */
            letter-spacing: -6px;
            color: #ffffff;
            font-variant-numeric: tabular-nums;
            line-height: 0.95;
            text-shadow: 0 0 60px rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body>

    <!-- 外框線 -->
    <div class="bezel-frame"></div>

    <!-- 上下左右精密刻度 -->
    <div class="tick-marks-top" id="ticksTop"></div>
    <div class="tick-marks-bottom" id="ticksBottom"></div>
    <div class="tick-marks-left" id="ticksLeft"></div>
    <div class="tick-marks-right" id="ticksRight"></div>

    <div class="widget-landscape">
        <div class="header-info">
            <div class="city">台北</div>
            <div class="date-sub" id="dateSub">--</div>
        </div>
        <div class="time-container">
            <div class="time" id="time">00:00</div>
        </div>
    </div>

    <script>
        // 動態生成刻度
        function createTicks() {
            const topBottomCount = 24;
            const leftRightCount = 12;

            const ticksTop = document.getElementById('ticksTop');
            const ticksBottom = document.getElementById('ticksBottom');
            const ticksLeft = document.getElementById('ticksLeft');
            const ticksRight = document.getElementById('ticksRight');

            for (let i = 0; i <= topBottomCount; i++) {
                const isMajor = i % 4 === 0;
                ticksTop.innerHTML += `<div class="tick ${isMajor ? 'major' : ''}"></div>`;
                ticksBottom.innerHTML += `<div class="tick ${isMajor ? 'major' : ''}"></div>`;
            }

            for (let i = 0; i <= leftRightCount; i++) {
                const isMajor = i % 4 === 0;
                ticksLeft.innerHTML += `<div class="tick-h ${isMajor ? 'major' : ''}"></div>`;
                ticksRight.innerHTML += `<div class="tick-h ${isMajor ? 'major' : ''}"></div>`;
            }
        }

        function updateClock() {
            const now = new Date();
            
            // 城市日期格式化
            const options = { month: 'long', day: 'numeric', weekday: 'long' };
            document.getElementById('dateSub').textContent = now.toLocaleDateString('zh-TW', options);

            // 時間格式化
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('time').textContent = `${hours}:${minutes}`;
        }

        createTicks();
        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
